name: model-acceptance
on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      scope:
        description: 'smoke first; full runs 800 tasks with oracle, nop and Astra'
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Require model access before creating workers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - id: plan
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import json, os
          assert os.environ['SCOPE'] in ['smoke', 'full']
          count = 1 if os.environ['SCOPE'] == 'smoke' else 100
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('shards=' + json.dumps(list(range(count))) + '\n')
              out.write(f'count={count}\n')
          PY
  trials:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SCOPE: ${{ inputs.scope }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ needs.plan.outputs.count }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'harbor @ git+https://github.com/harbor-framework/harbor.git@2993946dd5b64a46dac3aa766d03065f432a1468'
      - run: bash scripts/build-images.sh
      - run: python scripts/prepare-model-acceptance.py --scope "$SCOPE" --shard "$SHARD" --shards "$SHARDS"
      - name: Reference solutions with live judges
        id: oracle
        continue-on-error: true
        run: harbor run --ve 'OPENAI_API_KEY=${OPENAI_API_KEY}' --config runs/model-acceptance/oracle.yaml
      - name: No-op controls with live judges where required
        id: nop
        if: ${{ !cancelled() && steps.oracle.outcome != 'skipped' }}
        continue-on-error: true
        run: harbor run --ve 'OPENAI_API_KEY=${OPENAI_API_KEY}' --config runs/model-acceptance/nop.yaml
      - name: Astra player, isolated from the verifier
        if: ${{ !cancelled() && steps.oracle.outcome != 'skipped' }}
        continue-on-error: true
        run: harbor run --ae 'OPENAI_API_KEY=${OPENAI_API_KEY}' --ve 'OPENAI_API_KEY=${OPENAI_API_KEY}' --config runs/model-acceptance/codex.yaml
      - name: Summarize all trials including failures and coverage gaps
        if: ${{ !cancelled() && steps.oracle.outcome != 'skipped' }}
        run: |
          status=0
          for agent in oracle nop codex; do
            python scripts/summarize-model-acceptance.py "runs/model-acceptance/acceptance-$agent" runs/model-acceptance/selected-tasks.json --output "runs/model-acceptance/summary-$agent.json" || status=1
          done
          exit "$status"
      - name: Require reference/control rewards
        if: ${{ !cancelled() && steps.oracle.outcome != 'skipped' }}
        run: |
          python scripts/check-harbor-results.py runs/model-acceptance/acceptance-oracle 1 @runs/model-acceptance/selected-tasks.json
          python scripts/check-harbor-results.py runs/model-acceptance/acceptance-nop 0 @runs/model-acceptance/selected-tasks.json
      - name: Live judge alternatives and negative controls (synthetic post-states)
        if: ${{ !cancelled() && inputs.scope == 'smoke' && steps.oracle.outcome == 'success' }}
        run: |
          python scripts/judge-acceptance-fixtures.py runs/model-acceptance/acceptance-oracle runs/model-acceptance/fixtures
          python scripts/run-judge-fixtures.py runs/model-acceptance/fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-acceptance-${{ inputs.scope }}-${{ matrix.shard }}
          path: runs/model-acceptance/
