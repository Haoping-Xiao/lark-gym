name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      astra_scope:
        description: 'Astra player + live judge acceptance; run smoke before full'
        type: choice
        options: ['off', smoke, full]
        default: 'off'
      run_model_judges:
        description: 'Run all native Harbor trials with live semantic judges (requires verifier model credentials)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: gyms/lark-cli/cli/go.sum
      - run: npm ci
      - run: npm run build:cli
      - run: npm run check
      - run: npm run oracle
  # CI runs deterministic checks only; model runs require explicit authorization.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'harbor @ git+https://github.com/harbor-framework/harbor.git@2993946dd5b64a46dac3aa766d03065f432a1468'
      - run: bash scripts/build-images.sh
      - run: harbor run --path tasks/maintenance-notice --agent oracle --jobs-dir runs/harbor --job-name maintenance-oracle
      - run: python scripts/check-harbor-results.py runs/harbor/maintenance-oracle 1 maintenance-notice
      - run: harbor run --path tasks/maintenance-notice --agent nop --jobs-dir runs/harbor --job-name maintenance-nop
      - run: python scripts/check-harbor-results.py runs/harbor/maintenance-nop 0 maintenance-notice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-harbor-results
          path: runs/harbor/
  harbor_plan:
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_judges
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PLAN'
          import json, math, os
          from pathlib import Path
          total = sum(p.is_dir() for p in Path('tasks').glob('automationbench-*'))
          assert total > 0
          count = math.ceil(total / 32)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('shards=' + json.dumps(list(range(count))) + '\n')
              output.write('count=' + str(count) + '\n')
          print(f'{total} tasks across {count} shards, at most 32 per shard')
          PLAN
  native-harbor:
    needs: harbor_plan
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.harbor_plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require configured verifier credentials
        run: test -n "$OPENAI_API_KEY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'harbor @ git+https://github.com/harbor-framework/harbor.git@2993946dd5b64a46dac3aa766d03065f432a1468'
      - run: bash scripts/build-images.sh
      - name: Check one native Harbor task before the full suite
        timeout-minutes: 10
        run: |
          harbor run --ve OPENAI_API_KEY="$OPENAI_API_KEY" --path tasks/automationbench-simple-3001 --agent oracle --jobs-dir runs/harbor --job-name smoke-oracle
          python scripts/check-harbor-results.py runs/harbor/smoke-oracle 1 automationbench-simple-3001
          harbor run --ve OPENAI_API_KEY="$OPENAI_API_KEY" --path tasks/automationbench-simple-3001 --agent nop --jobs-dir runs/harbor --job-name smoke-nop
          python scripts/check-harbor-results.py runs/harbor/smoke-nop 0 automationbench-simple-3001
      - run: python scripts/select-harbor-shard.py ${{ matrix.shard }} ${{ needs.harbor_plan.outputs.count }}
      - run: harbor run --ve OPENAI_API_KEY="$OPENAI_API_KEY" --config runs/harbor/oracle.yaml
      - run: python scripts/check-harbor-results.py runs/harbor/automationbench-oracle 1 @runs/harbor/selected-tasks.json
      - run: harbor run --ve OPENAI_API_KEY="$OPENAI_API_KEY" --config runs/harbor/nop.yaml
      - run: python scripts/check-harbor-results.py runs/harbor/automationbench-nop 0 @runs/harbor/selected-tasks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-harbor-results-${{ matrix.shard }}
          path: runs/harbor/
  model-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.astra_scope != 'off'
    uses: ./.github/workflows/model-acceptance.yml
    with:
      scope: ${{ inputs.astra_scope }}
    secrets: inherit
