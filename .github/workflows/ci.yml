name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: gyms/lark-cli/cli/go.sum
      - run: npm ci
      - run: npm run build:cli
      - run: npm run check
      - run: npm run oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-results
          path: runs/
  # CI runs deterministic checks only. Real Codex smoke runs require an authorized login.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash scripts/test-harbor-container.sh
  harbor_plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python - <<'PLAN'
          import json, math, os
          from pathlib import Path
          total = sum(p.is_dir() for p in Path('tasks').glob('automationbench-*'))
          assert total > 0
          count = math.ceil(total / 32)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('shards=' + json.dumps(list(range(count))) + '\n')
              output.write('count=' + str(count) + '\n')
          print(f'{total} tasks across {count} shards, at most 32 per shard')
          PLAN
  native-harbor:
    needs: harbor_plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.harbor_plan.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'harbor @ git+https://github.com/harbor-framework/harbor.git@2993946dd5b64a46dac3aa766d03065f432a1468'
      - run: bash scripts/build-images.sh
      - name: Check one native Harbor task before the full suite
        timeout-minutes: 10
        run: |
          harbor run --path tasks/automationbench-simple-3001 --agent oracle --jobs-dir runs/harbor --job-name smoke-oracle
          python scripts/check-harbor-results.py runs/harbor/smoke-oracle 1 automationbench-simple-3001
          harbor run --path tasks/automationbench-simple-3001 --agent nop --jobs-dir runs/harbor --job-name smoke-nop
          python scripts/check-harbor-results.py runs/harbor/smoke-nop 0 automationbench-simple-3001
      - run: python scripts/select-harbor-shard.py ${{ matrix.shard }} ${{ needs.harbor_plan.outputs.count }}
      - run: harbor run --config runs/harbor/oracle.yaml
      - run: python scripts/check-harbor-results.py runs/harbor/automationbench-oracle 1 @runs/harbor/selected-tasks.json
      - run: harbor run --config runs/harbor/nop.yaml
      - run: python scripts/check-harbor-results.py runs/harbor/automationbench-nop 0 @runs/harbor/selected-tasks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-harbor-results-${{ matrix.shard }}
          path: runs/harbor/
