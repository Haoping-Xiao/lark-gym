services:
  main:
    init: false
    entrypoint: ['node', '/opt/task/agent-lifetime.mjs']
    command: []
    volumes:
      - task-control:/run/task-control:ro
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FEISHU_MOCK_URL: http://mock:8080
    depends_on:
      mock:
        condition: service_healthy
  mock:
    volumes:
      - task-control:/run/task-control
    build:
      context: .
      dockerfile: mock.Dockerfile
    expose: ['8080']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:fs').accessSync('/var/lib/feishu-mock/endpoint')",
        ]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  task-control: {}
